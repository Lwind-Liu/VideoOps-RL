[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videoops-rl"
version = "0.1.0"
description = "Evidence-grounded multi-agent RL environment for long-video understanding"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.20",
  "numpy>=1.26",
  "open_clip_torch>=3.2.0",
  "PyYAML>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
