project: videoops-rl
task: evidence_grounded_temporal_qa
environment: synthetic_v0
max_steps: 8
reward:
  success: 1.0
  target_inspection: 0.2
  duplicate_action_penalty: 0.1
  tool_cost_penalty: 0.05
  wrong_answer: 0.5
evaluation:
  split_by: video_id
  metrics:
    - task_success
    - temporal_iou
    - evidence_support_rate
    - tool_calls

